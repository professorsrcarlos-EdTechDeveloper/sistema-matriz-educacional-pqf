<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=painel-coordenador.html">
<title>Painel Professor — MATRIZ EDUCACIONAL</title>
<style>
:root{--bg:#05080f;--green:#38f2a6;--blue:#42b7ff;--gold:#ffd36a;--line:rgba(255,255,255,.14);--muted:#b7c3d8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 15% 10%,rgba(56,242,166,.18),transparent 28%),radial-gradient(circle at 85% 15%,rgba(66,183,255,.16),transparent 30%),linear-gradient(180deg,#05080f,#07121f 52%,#05080f)}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.033) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.033) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 82%)}
.card{position:relative;width:min(92%,520px);padding:34px;border:1px solid var(--line);border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.045));box-shadow:0 24px 80px rgba(0,0,0,.38);text-align:center;backdrop-filter:blur(14px)}
.logo{width:88px;height:88px;border-radius:28px;margin:0 auto 18px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;color:#031018;font-weight:950;font-size:1.4rem;box-shadow:0 0 34px rgba(56,242,166,.30)}
h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.07em;line-height:.95;background:linear-gradient(135deg,#fff,var(--green),var(--blue),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
p{color:var(--muted);line-height:1.7;margin-bottom:20px}
a{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:999px;text-decoration:none;font-weight:950;background:linear-gradient(135deg,var(--green),var(--blue));color:#031018;box-shadow:0 18px 48px rgba(56,242,166,.22)}
</style>
<script>setTimeout(()=>{location.href='painel-coordenador.html'},300);</script>
</head>
<body>
  <div class="card">
    <div class="logo">MX</div>
    <h1>Painel Xyntropic</h1>
    <p>Redirecionando para o Painel de Gestão e Coordenação do Sistema MATRIZ EDUCACIONAL.</p>
    <a href="painel-coordenador.html">Abrir painel agora</a>
  </div>
</body>
</html>
